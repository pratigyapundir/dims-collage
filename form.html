<!DOCTYPE html>
<html>
<head>
  <title>College Admission Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right bottom, #0a0a0a, #130f49);
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-decoration-color: aqua;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    form {
      background: linear-gradient(to top right,  #130f49,#0a0a0a );
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.356);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: white;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #06b1cfb2;
      border-radius: 5px;
      color: rgb(8, 0, 0);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #880da1;
       background-color: #00e6e6;
      box-shadow: 0 0 15px #00ffff;
    }

    footer {
      background-color: #130f49;
      color: white;
      text-align: center;
      padding: 15px 0;
    }
  </style>
</head>
<body>
  

  <div class="container">
    <main>
      <form id="admissionForm" onsubmit="handleSubmit(event)">
        <h2>College Admission Form</h2>

        <label for="name">Full Name</label>
        <input type="text" name="name" id="name" required>

        <label for="phone">Phone Number</label>
        <input type="tel" name="phone" id="phone" required>

        <label for="address">Address</label>
        <textarea name="address" id="address" rows="3" required></textarea>

        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob" required>

        <label for="education">General Education</label>
        <select name="education" id="education" required>
          <option value="">-- Select Qualification --</option>
          <option value="High School">High School</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Diploma">Diploma</option>
          <option value="Graduate">Graduate</option>
        </select>

        <label for="course">College Course</label>
        <select name="course" id="course" required>
          <option value="">-- Select Course --</option>
          <option value="BCA">BCA</option>
          <option value="BBA">BBA</option>
          <option value="BCOM">BCOM</option>
          <option value="LAW">LAW</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Submit</button>
      </form>
    </main>

    <script>
      function handleSubmit(event) {
        event.preventDefault(); // stop default form

        const form = document.getElementById("admissionForm");
        const formData = new FormData(form);

        // Send form data using fetch POST
        fetch("/cgi-bin/form.cgi", {
          method: "POST",
          body: formData
        })
      .then(response => response.text())
      .then(data => {
        // ✅ Show next page or redirect
        window.location.href = "next.html";  // or show confirmation inline
        })
        .catch(error => {
          alert("Submission failed.");
          console.error(error);
        });
      }
    </script>

    <footer>
      &copy; 2025 ABC College. All rights reserved.
    </footer>
  </div>

</body>
</html>
