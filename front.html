<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
   <style>
    body {
      font-family: Arial, sans-serif;
     background: linear-gradient(to left top, #358cdd, #db35b2);
      margin: 0px;
      padding: 50px;
      box-shadow:0 0 100px rgba(245, 1, 224, 0.938);
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: 80px auto;
    background: linear-gradient( bottom right, #047cec, #e7185d);
      padding: 30px;
      border-radius: 8px;
      box-shadow:0  0 50px  #ff00dd;
    }

    h2 {
      text-align: center;
      color: #740e55;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      
      border: 1px solid #fc06be;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1a7eb8;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      
      background-color: #029df7;
      box-shadow: 0 0 15px #00c3ff;
    }

    .toggle-form {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .toggle-form a {
      color: #720f54;
      text-decoration: none;
    }

    .toggle-form a:hover {
      text-decoration: dotted;
    }

    .hidden {
      display: none;
    }
     footer {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 1px 0;
      margin-top: 1px;
    }
  </style>

<body>

  <div class="container">
    <h2 id="form-title">Sign In</h2>

    <!-- Sign In Form -->
    <form id="signin-form">
      <input type="email" id="signin-email" placeholder="Email" required>
      <input type="password" id="signin-password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="hidden">
      <input type="text" id="signup-username" placeholder="Username" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <div class="toggle-form">
      <span id="toggle-msg">Don't have an account?</span>
      <a href="#" id="toggle-link">Sign Up</a>
    </div>
  </div>

  <script>
    const signinForm = document.getElementById("signin-form");
    const signupForm = document.getElementById("signup-form");
    const toggleLink = document.getElementById("toggle-link");
    const toggleMsg = document.getElementById("toggle-msg");
    const formTitle = document.getElementById("form-title");

    // Switch between Sign In and Sign Up
    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      signinForm.classList.toggle("hidden");
      signupForm.classList.toggle("hidden");
      if (signinForm.classList.contains("hidden")) {
        toggleLink.textContent = "Sign In";
        toggleMsg.textContent = "Already have an account?";
        formTitle.textContent = "Sign Up";
      } else {
        toggleLink.textContent = "Sign Up";
        toggleMsg.textContent = "Don't have an account?";
        formTitle.textContent = "Sign In";
      }
    });

    // Sign In handler
    signinForm.addEventListener("submit", function (e) {
      e.preventDefault();

      // 👉 You can validate here or send data to backend
      const email = document.getElementById("signin-email").value;
      const pass = document.getElementById("signin-password").value;

      if (email && pass) {
        // Simulate success
        window.location.href = "next.html";
      } else {
        alert("Please fill out all fields.");
      }
    });

    // Sign Up handler
    signupForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("signup-username").value;
      const email = document.getElementById("signup-email").value;
      const pass = document.getElementById("signup-password").value;

      if (username && email && pass) {
        // Simulate success
        window.location.href = "next.html";
      } else {
        alert("Please fill out all fields.");
      }
    });
  </script>

</body>
</html>
