  <!DOCTYPE html>

  <head>
    <title>Welcome Page</title>
     <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: linear-gradient(to bottom right, #047cec, #e7185d); /* Light blue to light pink */
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #740e55;
      margin-bottom: 10px;
      font-size: 30px;
      text-transform: unset;
    }
    h2{
      color: #77054bd3;
      margin-bottom: 20px;
      font-size: 35px;
      font-weight: bold;
      text-transform: uppercase;
    }

    p {
      font-size: 25px;
      color: #360222d3;
      margin-bottom: 50px;
      font-style: italic bold;
      font-family: Georgia, 'Times New Roman', Times, serif;
      text-transform: uppercase;
    }

    img {
      width: 200px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .button {
      padding: 10px 25px;
      font-size: 16px;
      color: rgb(230, 237, 240);
      background-color: #2781e9;
      border: chocolate;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 25px;
      background-color: #0d47a1;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    .button:hover {
      background-color: #b9187b;
      background-color: #e600e6;
      box-shadow: 0 0 15px #00c3ff;
      
    }
    
  </style>
